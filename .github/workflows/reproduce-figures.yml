name: Reproduce FND figures
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python src/run_all.py --suite all
      - uses: actions/upload-artifact@v4
        with:
          name: fnd-synthetic-figures-and-checks
          path: outputs/
